schema: spec-driven

context: |
  Escrever todos os artefatos em português do Brasil.
  Só enviar ao hardware comandos documentados em docs/hardware.md, no código do OpenRGB
  (/mnt/workspace/tools/repos/openrgb, commit 72262b8) ou em análise feita com o REA.
  Nada de testar bytes desconhecidos no hardware.
  Todo dispositivo novo começa com uma ferramenta que só lê.
  Encontrar dispositivos por VID:PID e usage page, nunca por /dev/hidrawN fixo.
  O OpenRGB é só referência de protocolo, não dependência. Código portado dele exige GPL-2.0-or-later.
  Teclado Redragon (258a:013b), RAM/SMBus e parâmetros de boot ficam fora do escopo sem pedido explícito.
  Não usar comandos dos drivers Sino Wealth do OpenRGB no teclado Redragon.

rules:
  design:
    - Citar a fonte de cada byte de protocolo usado (arquivo e função do OpenRGB, ou análise do REA)
  tasks:
    - Incluir uma task para atualizar docs/hardware.md quando a change descobrir algo novo sobre o hardware
    - Tasks que enviam comandos ao hardware devem dizer qual comando e de onde ele vem
