[package]
name = "halo-daemon"
description = "Daemon do usuário do halo: D-Bus da sessão e perfis"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "halod"
path = "src/main.rs"

[dependencies]
halo-core = { path = "../halo-core" }
async-channel = "2"
async-io = "2"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
zbus = "5"

[dev-dependencies]
tempfile = "3"
